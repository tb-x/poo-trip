<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Poo's Big Trip</title>
<meta name="description" content="Steer a cute little poo through the pipes all the way to its holiday.">
<meta name="theme-color" content="#3a2414">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="Poo's Trip">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Layout: one full-screen pixel-art canvas (bathroom, then pipes scrolling up, then the holiday spot). On top: a
   postcard menu card, a small HUD (home, progress track, sound) and two big arrow pads in the bottom corners. */
:root {
  --ink: #3a2414;
  --ink-soft: #7a5236;
  --paper: #fff8ec;
  --card: #ffffff;
  --gold: #ffd166;
  --green: #4caf50;
  --night: #1a0f08;
  --font-pixel: 'Press Start 2P', 'Courier New', monospace;
  --font-body: Verdana, Tahoma, 'Segoe UI', system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--night);
  color: var(--ink);
  font-family: var(--font-body);
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}
#game {
  position: fixed;
  left: 0;
  top: 0;
  image-rendering: pixelated;
  touch-action: none;
}
button {
  font: inherit;
  color: inherit;
  cursor: pointer;
  touch-action: manipulation;
}
[hidden] { display: none !important; }

/* ---- menu and end cards ---- */
.panel {
  position: fixed;
  left: 50%;
  top: calc(12px + env(safe-area-inset-top, 0px));
  transform: translateX(-50%);
  width: min(560px, calc(100% - 24px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)));
  max-height: calc(100% - 24px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  overflow: auto;
  padding: 14px 14px 16px;
  background: var(--paper);
  border: 4px solid var(--ink);
  border-radius: 8px;
  box-shadow: 0 6px 0 var(--ink);
  text-align: center;
}
h1, h2 {
  margin: 4px 44px 10px;
  font: 400 clamp(15px, 4.4vw, 24px)/1.4 var(--font-pixel);
  color: #7a3f12;
}
.where { margin: 0 0 12px; font-weight: 700; font-size: 18px; }
#cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
  gap: 10px;
}
.card {
  position: relative;
  display: flex;
  flex-direction: column;
  padding: 0;
  overflow: hidden;
  background: var(--card);
  border: 3px solid var(--ink);
  border-radius: 6px;
  box-shadow: 0 4px 0 var(--ink);
  font-weight: 700;
  font-size: 15px;
}
.card:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.card canvas {
  display: block;
  width: 100%;
  aspect-ratio: 120 / 76;
  image-rendering: pixelated;
  border-bottom: 3px solid var(--ink);
}
.card .label { padding: 5px 2px 6px; white-space: nowrap; }
.card .best { display: block; font-size: 13px; color: var(--ink-soft); }
.card .num {
  position: absolute;
  top: 5px;
  left: 5px;
  min-width: 24px;
  height: 24px;
  display: grid;
  place-items: center;
  border: 2px solid var(--ink);
  border-radius: 50%;
  background: var(--paper);
  font-size: 13px;
}
.card:disabled { cursor: default; background: #e8dccb; }
.card:disabled:active { transform: none; box-shadow: 0 4px 0 var(--ink); }
.card:disabled canvas { filter: grayscale(1) brightness(0.55); }
.card .lock {
  position: absolute;
  top: 34%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 30px;
  filter: drop-shadow(0 2px 0 var(--ink));
}
.card .stamp {
  position: absolute;
  top: 5px;
  right: 5px;
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border: 3px solid var(--ink);
  border-radius: 50%;
  background: var(--green);
  color: #fff;
  font-size: 15px;
  transform: rotate(-12deg);
}
#done h2 { font-size: clamp(18px, 5.4vw, 30px); margin: 4px 0 8px; }
.ducks { margin: 0 0 14px; font: 400 clamp(16px, 4.6vw, 24px)/1.4 var(--font-pixel); }
#done .row { display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap; }
#done .big { padding: 12px; font-size: 18px; }
.big.alt { background: var(--card); }
.big {
  padding: 14px 26px;
  border: 4px solid var(--ink);
  border-radius: 8px;
  background: var(--gold);
  box-shadow: 0 5px 0 var(--ink);
  font-weight: 700;
  font-size: 22px;
}
.big:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }

/* ---- HUD ---- */
.round {
  width: 52px;
  height: 52px;
  padding: 0;
  border: 3px solid var(--ink);
  border-radius: 8px;
  background: var(--paper);
  box-shadow: 0 4px 0 var(--ink);
  font-size: 25px;
  line-height: 1;
}
.round:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
#menu .sound {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 44px;
  height: 44px;
  font-size: 21px;
}
#hud {
  position: fixed;
  top: calc(10px + env(safe-area-inset-top, 0px));
  left: calc(10px + env(safe-area-inset-left, 0px));
  right: calc(10px + env(safe-area-inset-right, 0px));
  display: flex;
  align-items: center;
  gap: 14px;
  pointer-events: none;
}
#hud > * { pointer-events: auto; }
#hud .sound { margin-left: 28px; }
#track {
  position: relative;
  flex: 1;
  max-width: 420px;
  height: 18px;
  margin: 0 auto 0 0;
  border: 3px solid var(--ink);
  border-radius: 9px;
  background: #6b4a33;
}
#trackFill { height: 100%; width: 0; border-radius: 6px; background: var(--gold); }
#duckPill {
  display: flex;
  align-items: center;
  gap: 4px;
  height: 40px;
  padding: 0 10px 0 6px;
  border: 3px solid var(--ink);
  border-radius: 20px;
  background: var(--paper);
  box-shadow: 0 3px 0 var(--ink);
  font-size: 20px;
  pointer-events: none;
}
#duckPill b { min-width: 1.2em; font-size: 18px; text-align: center; }
#duckPill.bump { animation: bump 0.3s ease-out; }
@keyframes bump { 40% { transform: scale(1.25); } }
#trackPoo {
  position: absolute;
  top: 50%;
  left: 0;
  width: 40px;
  height: 40px;
  transform: translate(-50%, -54%);
  image-rendering: pixelated;
}
#trackGoal {
  position: absolute;
  top: 50%;
  right: 0;
  transform: translate(60%, -50%);
  font-size: 30px;
  line-height: 1;
  filter: drop-shadow(0 2px 0 var(--ink));
}
.pad {
  position: fixed;
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: 86px;
  height: 86px;
  padding: 0;
  display: grid;
  place-items: center;
  border: 4px solid var(--ink);
  border-radius: 10px;
  background: rgba(255, 248, 236, 0.86);
  box-shadow: 0 6px 0 var(--ink);
}
.pad img { width: 50px; height: 45px; image-rendering: pixelated; }
#leftBtn { left: calc(16px + env(safe-area-inset-left, 0px)); }
#rightBtn { right: calc(16px + env(safe-area-inset-right, 0px)); }
.pad.on, .pad:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--ink); background: var(--gold); }
.pad.pulse { animation: pulse 0.5s ease-in-out infinite alternate; }
@keyframes pulse { to { background: var(--gold); transform: scale(1.08); } }

/* Wide, short screens (a tablet or phone held sideways): the eight postcards in two rows of four. */
@media (min-aspect-ratio: 4/3) {
  .panel { width: min(780px, calc(100% - 200px)); }
  #cards { grid-template-columns: repeat(4, 1fr); }
}
@media (max-height: 430px) {
  .panel { padding: 8px 10px 10px; }
  h1 { margin: 2px 0 6px; }
  .where { margin-bottom: 8px; font-size: 15px; }
  .card { font-size: 15px; }
}
@media (prefers-reduced-motion: reduce) {
  .pad.pulse { animation: none; background: var(--gold); }
  #duckPill.bump { animation: none; }
}

/* ---- home button (back to all games), square and pixel-bordered like the HUD buttons ---- */
#home {
  position: fixed;
  top: calc(10px + env(safe-area-inset-top, 0px));
  left: calc(10px + env(safe-area-inset-left, 0px));
  z-index: 50;
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border: 3px solid var(--ink);
  border-radius: 8px;
  color: var(--ink);
  background: var(--paper);
  box-shadow: 0 4px 0 var(--ink);
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  text-decoration: none;
}
#home svg { width: 24px; height: 24px; }
#home:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
/* Keep the HUD and the cards clear of it. */
#hud { left: calc(68px + env(safe-area-inset-left, 0px)); }
@media (max-width: 687px) and (max-aspect-ratio: 4/3) {   /* upright phone: the card fills the width, so it starts below the button */
  .panel {
    top: calc(64px + env(safe-area-inset-top, 0px));
    max-height: calc(100% - 76px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  }
}
@media (min-aspect-ratio: 4/3) {   /* sideways: also leave room for a notch, which pushes the button in */
  .panel { width: min(780px, calc(100% - 200px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px))); }
}
</style>
</head>
<body>
<a id="home" href="../index.html" aria-label="All games" title="All games"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 9.8V20h12V9.8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/><path d="M10 20v-5.5h4V20" fill="currentColor"/></svg></a>
<canvas id="game" aria-label="A little poo rides through the pipes"></canvas>

<section id="menu" class="panel">
  <button class="round sound" type="button" aria-label="Sound on or off">🔊</button>
  <h1>Poo's Big Trip</h1>
  <p class="where">Where to? 🧳</p>
  <div id="cards"></div>
</section>

<section id="done" class="panel" hidden>
  <h2 id="doneTitle">Beach!</h2>
  <p id="doneDucks" class="ducks" aria-label="Ducks caught"></p>
  <div class="row">
    <button id="mapBtn" class="round" type="button" aria-label="Back to the postcards">🗺️</button>
    <button id="againBtn" class="big alt" type="button" aria-label="Same trip again">🚽 Again</button>
    <button id="nextBtn" class="big" type="button">Next</button>
  </div>
</section>

<div id="hud" hidden>
  <button id="homeBtn" class="round" type="button" aria-label="Back to the postcards">🗺️</button>
  <div id="track" aria-hidden="true">
    <div id="trackFill"></div>
    <img id="trackPoo" alt="">
    <span id="trackGoal"></span>
  </div>
  <div id="duckPill" aria-label="Ducks caught"><span aria-hidden="true">🦆</span><b id="duckN">0</b></div>
  <button class="round sound" type="button" aria-label="Sound on or off">🔊</button>
</div>
<button id="leftBtn" class="pad" type="button" aria-label="Turn left" hidden></button>
<button id="rightBtn" class="pad" type="button" aria-label="Turn right" hidden></button>

<script>
'use strict';

/* ======== tuning knobs ======== */
// One trip per level, played in order: finishing one opens the next. Per level:
//   rows   rows of junctions (keep it even, so the last row leads back to the middle)
//   dead   chance that one way out of a turn is closed
//   pump   share of the closed ways that are red pump pipes (they blow the poo back up a row) instead of no-entry signs
//   ducks  chance of rubber ducks on an open pipe        gate   chance of a gate that opens and shuts on an open pipe
//   water  chance of a water rush                       tp     chance of a toilet paper clog
//   speed  riding speed, times BASE_SPEED                hurry  the poo picks a way itself after HURRY_WAIT seconds
//   dark   only the poo's lamp lights the pipes          tip    what the voice says at the start
const LEVELS = [
  { id: 'beach',     rows: 8,  dead: 0.35, pump: 0,    ducks: 0.5,  gate: 0,    water: 0.22, tp: 0.12, speed: 1,    tip: 'Catch the rubber ducks!' },
  { id: 'mountains', rows: 10, dead: 0.45, pump: 0,    ducks: 0.45, gate: 0,    water: 0.2,  tp: 0.16, speed: 1 },
  { id: 'city',      rows: 10, dead: 0.5,  pump: 0.5,  ducks: 0.45, gate: 0,    water: 0.2,  tp: 0.14, speed: 1,    tip: 'Red pipes blow you back up!' },
  { id: 'jungle',    rows: 12, dead: 0.5,  pump: 0.4,  ducks: 0.45, gate: 0.3,  water: 0.18, tp: 0.12, speed: 1.05, tip: 'Gates open and shut. Wait for a gap!' },
  { id: 'desert',    rows: 12, dead: 0.55, pump: 0.5,  ducks: 0.4,  gate: 0.3,  water: 0.16, tp: 0.14, speed: 1.1 },
  { id: 'farm',      rows: 12, dead: 0.55, pump: 0.5,  ducks: 0.4,  gate: 0.3,  water: 0.16, tp: 0.14, speed: 1.15, hurry: true, tip: 'Hurry! Pick a pipe fast!' },
  { id: 'snow',      rows: 14, dead: 0.6,  pump: 0.5,  ducks: 0.4,  gate: 0.3,  water: 0.16, tp: 0.12, speed: 1.1,  dark: true, tip: "It's dark down there! Follow the ducks." },
  { id: 'island',    rows: 14, dead: 0.6,  pump: 0.55, ducks: 0.4,  gate: 0.35, water: 0.16, tp: 0.12, speed: 1.2,  dark: true, hurry: true, tip: 'Dark and fast! You can do it!' },
];
const MAX_BRANCHES = 3;            // most pipes running side by side
const BASE_SPEED = 93;             // game pixels per second
const BOOST_SPEED = 225;           // speed while riding a water rush
const BOOST_TIME = 2.4;            // seconds the water rush lasts
const CLOG_SPEED = 24;             // speed while pushing a toilet paper clog
const CLOG_TIME = 1.6;             // seconds until the clog pops
const BONK_TIME = 1.1;             // seconds of dizzy stars after a dead end
const STUB_DUCK_CHANCE = 0.4;      // chance of a duck waiting just before a no-entry sign (worth the bonk?)
const GATE_OPEN = 2.4, GATE_SHUT = 1.8;   // seconds a gate stays open, then shut
const WHOOSH_SPEED = 270;          // speed when a pump blows the poo back up
const HURRY_WAIT = 1.6;            // on hurry levels, seconds the poo waits at a junction before it picks a way itself
const LAMP_R = 84;                 // on dark levels, how far the poo's lamp shines

/* ======== layout ======== */
const LANES = 5, LANE_GAP = 50;    // pipe lanes across the field
const FIELD_W = 252;               // width of the pipe area, in game pixels
const MIN_VIEW_H = 315;            // the screen always shows at least this many game pixels vertically
const LOOK = 0.3;                  // the poo rides at this fraction of the screen height, so turns show up early
const laneX = i => 26 + i * LANE_GAP;
const CX = laneX(2);               // the middle lane, under the toilet
const PIPE_R = 19, PIPE_IN = 14;   // pipe half-width outside and inside
const ROW_MIN = 140, ROW_MAX = 190, FIRST_DROP = 170, DEAD_LEN = 60, EXIT_LEN = 225;
const POO_SIZE = 32, POO_AX = 16, POO_AY = 19, POO_START_Y = -40;
const FLUSH_TIME = 1.3, IRIS_TIME = 0.7;
const FLOOR_H = 20;                // bathroom floor and concrete, between the toilet and the dirt
const ASSET_V = 1;                 // bump after changing anything in assets/

const C = {
  eye: '#1b1010', white: '#ffffff', cheek: '#ff8fa8', mouth: '#5a1a1a', tongue: '#ff6f8a',
  pipeInk: '#1d2b2a', pipe: '#3f9c86', pipeLight: '#86dcc2', pipeDark: '#2a6f60',
  inside: '#26383d', water: '#3aa0ff', waterLight: '#b4e2ff',
  porc: '#f4f8ff', porcShade: '#c9d4e6', porcInk: '#3a4660', bowlWater: '#8fd3ff', bowlDeep: '#5fb7ea',
  wall: '#bfe7f3', wallLow: '#e6f6fb', wallLine: '#9fd2e3', wallBand: '#5fb8d3',
  floorA: '#f2e3c6', floorB: '#d8bf93', concrete: '#8f8a84', yellow: '#ffd43b', night: '#1a0f08',
};

/* ======== storage ======== */
const store = {
  get(k, d) { try { const v = localStorage.getItem('pootrip.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('pootrip.' + k, JSON.stringify(v)); } catch {} },
};

/* ======== sound ======== */
const Sound = (() => {
  let ac = null, out = null, noiseBuf = null;
  let muted = store.get('muted', false);
  const touch = navigator.maxTouchPoints > 0;

  function unlock() {
    if (!ac) {
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        out = ac.createGain();
        out.gain.value = muted ? 0 : 0.6;
        out.connect(ac.destination);
        noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      } catch { ac = null; return; }
    }
    if (ac.state === 'suspended') ac.resume();
  }
  function env(gain, at, v, d) {
    gain.gain.setValueAtTime(0.0001, at);
    gain.gain.exponentialRampToValueAtTime(v, at + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, at + d);
  }
  function tone(f, f2, d, type = 'sine', v = 0.3, delay = 0, vib = 0) {
    if (!ac || muted) return;
    const at = ac.currentTime + delay;
    const o = ac.createOscillator(), gn = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, at);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, at + d);
    if (vib) {
      const l = ac.createOscillator(), lg = ac.createGain();
      l.frequency.value = vib; lg.gain.value = f * 0.18;
      l.connect(lg).connect(o.frequency); l.start(at); l.stop(at + d);
    }
    env(gn, at, v, d);
    o.connect(gn).connect(out);
    o.start(at); o.stop(at + d + 0.05);
  }
  function noise(d, f, f2, v = 0.3, delay = 0, type = 'bandpass', q = 1) {
    if (!ac || muted) return;
    const at = ac.currentTime + delay;
    const src = ac.createBufferSource(), fl = ac.createBiquadFilter(), gn = ac.createGain();
    src.buffer = noiseBuf;
    fl.type = type; fl.Q.value = q;
    fl.frequency.setValueAtTime(f, at);
    if (f2) fl.frequency.exponentialRampToValueAtTime(f2, at + d);
    env(gn, at, v, d);
    src.connect(fl).connect(gn).connect(out);
    src.start(at); src.stop(at + d + 0.05);
  }
  const SFX = {
    tap: () => tone(520, 780, 0.09, 'square', 0.07),
    flush: () => {
      noise(1.8, 1500, 240, 0.5, 0, 'bandpass', 0.7);
      for (let i = 0; i < 8; i++) tone(200 + Math.random() * 220, 480 + Math.random() * 300, 0.09, 'sine', 0.16, 0.15 + i * 0.17);
    },
    plop: () => tone(700, 110, 0.16, 'sine', 0.4),
    bonk: () => { tone(330, 120, 0.5, 'sine', 0.45, 0, 15); noise(0.1, 500, 200, 0.3, 0, 'lowpass'); },
    whee: () => { tone(320, 1150, 0.6, 'triangle', 0.22); noise(0.5, 2600, 1200, 0.16, 0, 'highpass'); },
    clog: () => { for (let i = 0; i < 3; i++) tone(150, 80, 0.16, 'square', 0.1, i * 0.45); },
    pop: () => { noise(0.14, 2800, 1500, 0.3); tone(900, 1500, 0.08, 'square', 0.08); },
    hint: () => { tone(660, null, 0.1, 'triangle', 0.15); tone(880, null, 0.13, 'triangle', 0.15, 0.13); },
    launch: () => { tone(200, 900, 0.35, 'triangle', 0.25); noise(0.3, 1800, 600, 0.2); },
    land: () => { tone(420, 90, 0.22, 'sine', 0.45); noise(0.16, 600, 200, 0.25, 0, 'lowpass'); },
    ding: () => { tone(1320, null, 0.35, 'sine', 0.2); tone(1760, null, 0.45, 'sine', 0.15, 0.08); },
    squeak: () => { tone(1100, 1700, 0.07, 'square', 0.08); tone(1500, 1250, 0.09, 'square', 0.07, 0.07); },
    whoosh: () => { tone(1100, 280, 0.7, 'triangle', 0.22); noise(0.7, 900, 3000, 0.2, 0, 'bandpass', 0.8); },
    clunk: () => { tone(160, 90, 0.12, 'square', 0.14); noise(0.06, 1200, 400, 0.2, 0, 'lowpass'); },
    fanfare: () => {
      [523, 659, 784, 1047].forEach((f, i) => tone(f, null, 0.18, 'triangle', 0.22, i * 0.12));
      [523, 659, 784, 1047].forEach(f => tone(f, null, 0.7, 'triangle', 0.11, 0.52));
    },
  };
  function say(text) {
    const ss = window.speechSynthesis;
    if (!ss || muted) return;
    try {
      ss.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US'; u.rate = 1; u.pitch = 1.35;
      const v = ss.getVoices().find(v => /^en[-_]US/i.test(v.lang)) || ss.getVoices().find(v => /^en/i.test(v.lang));
      if (v) u.voice = v;
      ss.speak(u);
    } catch {}
  }

const hexCache = new Map();

// Builds a small sprite pixel by pixel and returns it as a canvas.
function makeSprite(w, h, paint) {
  const px = new Array(w * h).fill(null);
  const s = {
    w, h,
    set(x, y, c) { x = Math.round(x); y = Math.round(y); if (x >= 0 && y >= 0 && x < w && y < h) px[y * w + x] = c; },
    get(x, y) { return x >= 0 && y >= 0 && x < w && y < h ? px[y * w + x] : null; },
    rect(x, y, rw, rh, c) { for (let j = 0; j < rh; j++) for (let i = 0; i < rw; i++) s.set(x + i, y + j, c); },
    ellipse(cx, cy, rx, ry, c) {
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        const nx = (x + 0.5 - cx) / rx, ny = (y + 0.5 - cy) / ry;
        if (nx * nx + ny * ny <= 1) s.set(x, y, typeof c === 'function' ? c(nx, ny, x, y) : c);
      }

    map(rows, pal, ox = 0, oy = 0) {
      rows.forEach((row, y) => [...row].forEach((ch, x) => { if (pal[ch]) s.set(ox + x, oy + y, pal[ch]); }));
    },
    outline(c) {
      const add = [];
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        if (px[y * w + x]) continue;
        if (s.get(x - 1, y) || s.get(x + 1, y) || s.get(x, y - 1) || s.get(x, y + 1)) add.push([x, y]);
      }
      for (const [x, y] of add) px[y * w + x] = c;
    },

  cv.width = w; cv.height = h;
  const g = cv.getContext('2d');
  const img = g.createImageData(w, h);
  px.forEach((c, i) => {
    if (!c) return;
    const [r, gg, b] = rgb(c);
    img.data.set([r, gg, b, 255], i * 4);
  });

}

function pooSprite(sq = 0, eyes = 'open', mouth = 'smile', look = 0) {
  const key = [sq, eyes, mouth, look].join('|');

    else if (eyes === 'wide') { rect(x, y - 1, 2, 4, K); set(x, y - 1, Wt); set(x, y, Wt); }

/* ======== the pipe world ======== */
// The pipes form rows of junctions over five lanes. At a T the poo turns left or right; at the two edge lanes the
// pipe bends back inward by itself. Branches that reach the same lane join, and some branches end at a no-entry
// sign or a red pump pipe. Every pipe always has at least one open way onward, and the last row leads back to the
// middle lane. Rubber ducks sit on some open pipes and in front of some signs; gates open and shut on others.
function seg(x1, y1, x2, y2, water = false, pump = false) {
  return { x1: Math.min(x1, x2), y1: Math.min(y1, y2), x2: Math.max(x1, x2), y2: Math.max(y1, y2), water, pump };
}
const other = side => side === 'L' ? 'R' : 'L';
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function buildWorld(L) {
  const w = { segs: [], items: [], rows: [], exitY: 0, maxDucks: 0 };
  let active = [2], y = FIRST_DROP;
  w.segs.push(seg(CX, FLOOR_H - 4, CX, y));
  for (let r = 0; r < L.rows; r++) {
    const last = r === L.rows - 1;
    const nodes = {};
    for (const lane of active) {
      const outs = lane === 0 ? { R: 1 } : lane === LANES - 1 ? { L: LANES - 2 } : { L: lane - 1, R: lane + 1 };
      nodes[lane] = { r, lane, y, outs, type: Object.keys(outs).length === 2 ? 'T' : 'bend', dead: null };
    }
    const list = Object.values(nodes);
    const all = new Set(list.flatMap(n => Object.values(n.outs)));
    const mustLive = new Set(list.filter(n => n.type === 'bend').flatMap(n => Object.values(n.outs)));
    const keepsAWayOn = set => list.every(n => Object.values(n.outs).some(l => set.has(l)));
    const tryClose = (live, l) => {
      const trial = new Set(live);
      trial.delete(l);
      return !mustLive.has(l) && keepsAWayOn(trial) ? trial : live;
    };
    let live = new Set(all);
    if (last) live = new Set([2]);
    else {
      for (const n of shuffle(list.filter(n => n.type === 'T')))
        if (Math.random() < L.dead) live = tryClose(live, n.outs[Math.random() < 0.5 ? 'L' : 'R']);
      for (const l of shuffle([...live])) if (live.size > MAX_BRANCHES) live = tryClose(live, l);
    }
    const ny = last ? y + EXIT_LEN : y + ROW_MIN + Math.floor(Math.random() * (ROW_MAX - ROW_MIN));
    // a closed lane is a pump pipe or a no-entry sign, the same for every turn that leads into it
    const kind = {};
    for (const l of all) if (!live.has(l)) kind[l] = r > 0 && Math.random() < L.pump ? 'pump' : 'sign';
    for (const n of list) {
      const lanes = [n.lane, ...Object.values(n.outs)];
      w.segs.push(seg(laneX(Math.min(...lanes)), y, laneX(Math.max(...lanes)), y));
      for (const [side, l] of Object.entries(n.outs)) if (!live.has(l)) { n.dead = side; n.deadKind = kind[l]; }
    }
    const segD = {}, stubD = {};
    const duck = (x, dy, l, stub) => { w.items.push({ type: 'duck', x, y: Math.round(y + dy), ph: Math.random() * 6 }); (stub ? stubD : segD)[l] = ((stub ? stubD : segD)[l] || 0) + 1; };
    for (const l of all) {
      const x = laneX(l);
      if (!live.has(l)) {
        if (kind[l] === 'pump') {
          w.segs.push(seg(x, y, x, y + DEAD_LEN, false, true));
          w.items.push({ type: 'pump', x, y: y + DEAD_LEN });
        } else {
          w.segs.push(seg(x, y, x, y + DEAD_LEN));
          w.items.push({ type: 'sign', x, y: y + DEAD_LEN });
          if (Math.random() < STUB_DUCK_CHANCE) duck(x, 28, l, true);
        }
        continue;
      }
      const roll = Math.random(), water = !last && roll < L.water;
      w.segs.push(seg(x, y, x, ny, water));
      if (water) w.items.push({ type: 'water', x, y: y + 21 });
      else if (!last && roll < L.water + L.tp) w.items.push({ type: 'tp', x, y: Math.round(y + (ny - y) * 0.55) });
      if (last) continue;
      if (Math.random() < L.ducks) for (let k = Math.random() < 0.35 ? 2 : 1; k > 0; k--) duck(x, (ny - y) * (0.17 + k * 0.13), l, false);
      if (Math.random() < L.gate) w.items.push({ type: 'gate', x, y: Math.round(y + (ny - y) * 0.8), ph: Math.random() * (GATE_OPEN + GATE_SHUT) });
    }
    w.rows.push({ y, nodes, segD, stubD });
    active = [...live];
    y = ny;
  }
  w.exitY = y;
  // The most ducks one trip can get: take the best way at every turn, plus the duck in front of a sign when there is one.
  const memo = {};
  const best = (r, lane) => {
    if (r >= w.rows.length) return 0;
    const key = r + ':' + lane;
    if (key in memo) return memo[key];
    const row = w.rows[r], n = row.nodes[lane];
    let b = 0;
    for (const [side, l] of Object.entries(n.outs)) if (n.dead !== side) b = Math.max(b, (row.segD[l] || 0) + best(r + 1, l));
    if (n.dead && n.deadKind === 'sign') b += row.stubD[n.outs[n.dead]] || 0;
    return memo[key] = b;
  };
  w.maxDucks = best(0, 2);
  return w;
}

// The waypoint where the poo arrives after leaving node n down lane `lane`.
function nextStop(n, lane) {
  const nr = world.rows[n.r + 1];
  return nr ? { x: laneX(lane), y: nr.y, j: nr.nodes[lane] } : { x: CX, y: world.exitY - 4, ev: 'end' };
}
// Waypoints after the poo turns `side` at node n.
function route(n, side) {
  const go = s => [{ x: laneX(n.outs[s]), y: n.y }, nextStop(n, n.outs[s])];
  if (n.dead !== side) return go(side);
  const X = laneX(n.outs[side]);
  if (n.deadKind === 'pump') return [{ x: X, y: n.y }, { x: X, y: n.y + DEAD_LEN - 18, ev: 'pump', n }];
  return [{ x: X, y: n.y }, { x: X, y: n.y + DEAD_LEN - 20, ev: 'bonk' }, { x: X, y: n.y }, ...go(other(side))];
}
// Gates slide shut and open again on a loop: 0 is wide open, 1 is shut.
function gateShut(it) {
  const t = ((trip ? trip.t : T) + it.ph) % (GATE_OPEN + GATE_SHUT), e = 0.35;
  if (t < GATE_OPEN) return t < e ? 1 - t / e : 0;
  return Math.min(1, (t - GATE_OPEN) / e);
}

function choose(side) {
  if (mode !== 'trip' || !poo || poo.state === 'exit') return;
  pending = side;
  Sound.play('tap');
  const pad = side === 'L' ? ui.left : ui.right;
  pad.classList.add('on');
  setTimeout(() => pad.classList.remove('on'), 150);
  if (poo.state === 'wait') resolveJunction();
}

function takeTurn(side) {
  const wp = poo.path.shift();
  poo.prevNode = poo.curNode;   // a pump blows the poo back up to the turn before this one
  poo.curNode = wp.j;
  poo.path.unshift(...route(wp.j, side));
}

function resolveJunction() {
  takeTurn(pending);
  pending = null;
  poo.state = 'ride';
  ui.left.classList.remove('pulse');
  ui.right.classList.remove('pulse');
}

function moveAlong(dist) {
  while (dist > 0 && poo.path.length) {
    const wp = poo.path[0];
    const dx = wp.x - poo.x, dy = wp.y - poo.y, d = Math.hypot(dx, dy);
    if (d > 0.001) { poo.dirX = dx / d; poo.dirY = dy / d; }
    if (d > dist) { poo.x += dx / d * dist; poo.y += dy / d * dist; return; }
    poo.x = wp.x; poo.y = wp.y; dist -= d;
    if (wp.j) {
      if (poo.state === 'whoosh') { poo.state = 'ride'; poo.speed = 15; poo.rideT = 1; }
      if (wp.j.type === 'bend') { takeTurn(Object.keys(wp.j.outs)[0]); continue; }
      if (!pending) { startWait(); return; }
      resolveJunction();
      continue;
    }
    poo.path.shift();
    if (wp.ev === 'bonk') { bonk(); return; }
    if (wp.ev === 'pump') { pumpBack(wp.n); return; }
    if (wp.ev === 'end') { poo.state = 'exit'; trip.irisT = 0; Sound.play('whee'); return; }
  }
}

// A red pump pipe blows the poo back up the way it came, to the turn before, where it can choose again.
function pumpBack(n) {
  const p = poo.prevNode, X = laneX(n.lane);
  poo.state = 'whoosh';
  poo.boostT = 0;
  if (poo.tp) popTP();
  pending = null;
  poo.path = [{ x: poo.x, y: n.y }, { x: X, y: n.y }, ...(p ? [{ x: X, y: p.y }, { x: laneX(p.lane), y: p.y, j: p }] : [{ x: X, y: n.y, j: n }])];
  trip.shake = 0.25;
  Sound.play('whoosh');
  Sound.buzz([40, 30, 40]);
  setTimeout(() => Sound.say(said.has('pumped') ? 'Whoosh!' : 'Whoosh! Back up!'), 150);
  said.add('pumped');
  for (let i = 0; i < 16; i++)
    parts.push({ x: poo.x + (Math.random() - 0.5) * 16, y: poo.y + 8, vx: (Math.random() - 0.5) * 50, vy: -20 - Math.random() * 60, g: 90, life: 0.6, c: i % 2 ? '#ffffff' : '#ffb4a8', w: 1, h: 2 });
}

function startWait() {
  poo.state = 'wait';
  poo.waitT = 0;
  poo.speed = 0;
  ui.left.classList.add('pulse');
  ui.right.classList.add('pulse');
  Sound.play('hint');
  if (!trip.asked) { trip.asked = true; setTimeout(() => Sound.say('Which way?'), 250); }
}

function bonk() {
  poo.state = 'bonk';
  poo.bonkT = BONK_TIME;
  poo.boostT = 0;
  if (poo.tp) popTP();
  trip.shake = 0.3;
  Sound.play('bonk');
  Sound.buzz([60, 40, 60]);
  Sound.say('Oops!');
}

function popTP() {
  const tp = poo.tp;
  if (!tp) return;
  tp.gone = true;
  poo.tp = null;
  poo.clogT = 0;
  for (let i = 0; i < 18; i++) {
    const a = Math.random() * Math.PI * 2, v = 30 + Math.random() * 60;
    parts.push({ x: tp.x, y: tp.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 20, g: 120, life: 0.8, c: i % 3 ? '#ffffff' : '#dfe6ef', w: 2, h: 2 });
  }
  Sound.play('pop');
}

function checkItems() {
  for (const it of world.items) {
    if (it.used || it.type === 'sign' || it.type === 'pump' || it.type === 'gate') continue;
    const d = Math.hypot(it.x - poo.x, it.y - poo.y);
    if (it.type === 'duck' && d < 12) {
      it.used = true;
      trip.ducks++;
      ui.duckN.textContent = trip.ducks;
      ui.duckPill.classList.remove('bump'); void ui.duckPill.offsetWidth; ui.duckPill.classList.add('bump');
      Sound.play('squeak');
      Sound.buzz([15]);
      for (let i = 0; i < 12; i++) {
        const a = i / 12 * Math.PI * 2;
        parts.push({ x: it.x, y: it.y, vx: Math.cos(a) * 45, vy: Math.sin(a) * 45 - 15, g: 60, life: 0.5, c: i % 2 ? '#ffd43b' : '#fff6c8', w: 1, h: 1 });
      }
    } else if (it.type === 'water' && d < 13) {
      it.used = true;
      if (poo.tp) popTP();
      poo.boostT = BOOST_TIME;
      Sound.play('whee');
      for (let i = 0; i < 14; i++)
        parts.push({ x: poo.x + (Math.random() - 0.5) * 14, y: poo.y, vx: (Math.random() - 0.5) * 70, vy: -30 - Math.random() * 50, g: 160, life: 0.6, c: i % 2 ? C.water : C.waterLight, w: 1, h: 2 });
    } else if (it.type === 'tp' && d < 22) {
      it.used = true;
      it.pushed = true;
      poo.tp = it;
      poo.clogT = CLOG_TIME;
      poo.boostT = 0;
      Sound.play('clog');
      Sound.buzz([25]);
    }
  }
}

function updateTrip(dt) {
  trip.t += dt;
  trip.shake = Math.max(0, trip.shake - dt);
  const p = poo;
  if (p.state === 'flush') {
    p.flushT += dt;
    if (p.flushT > FLUSH_TIME) { p.state = 'ride'; p.rideT = 0; p.speed = 8; }
  } else if (p.state === 'ride') {
    p.rideT += dt;
    if (p.boostT > 0) p.boostT -= dt;
    if (p.clogT > 0) { p.clogT -= dt; if (p.clogT <= 0) popTP(); }
    const base = BASE_SPEED * level.speed;
    let target = base;
    if (p.boostT > 0) target = base + (BOOST_SPEED - base) * Math.min(1, p.boostT / 0.8);
    if (p.clogT > 0) target = CLOG_SPEED;
    const wp = p.path[0];
    if (wp && wp.j && wp.j.type === 'T' && !pending) target = Math.min(target, 21 + Math.hypot(wp.x - p.x, wp.y - p.y) * 1.3);
    if (p.rideT < 1.2) target = Math.min(target, 15 + p.rideT * 82);
    p.speed += (target - p.speed) * Math.min(1, dt * (p.clogT > 0 ? 12 : 4));
    let dist = p.speed * dt;
    // a shut gate ahead: stop in front of it and wait for it to open
    const gate = p.dirY > 0.5 && world.items.find(it => it.type === 'gate' && Math.abs(it.x - p.x) < 1 && it.y > p.y && it.y - p.y < 40 && gateShut(it) > 0.1);
    if (gate && gate.y - 17 - p.y < dist) {
      dist = Math.max(0, gate.y - 17 - p.y);
      p.speed = 0;
      if (!p.blocked) {
        Sound.play('clunk');
        if (poo.tp) popTP();
        sayOnce('gate', 'Wait for the gate!', 100);
      }
      p.blocked = true;
    } else p.blocked = false;
    moveAlong(dist);
    checkItems();
    if (p.tp) {
      p.tp.x = p.x + p.dirX * 22;
      p.tp.y = p.y + p.dirY * 22;
      if (Math.random() < dt * 12)
        parts.push({ x: p.tp.x + (Math.random() - 0.5) * 12, y: p.tp.y - p.dirY * 4, vx: (Math.random() - 0.5) * 20, vy: -p.dirY * 20, g: 30, life: 0.5, c: '#ffffff', w: 2, h: 1 });
    }
    if (p.boostT > 0 && Math.random() < dt * 30)
      parts.push({ x: p.x + (Math.random() - 0.5) * 14, y: p.y - p.dirY * 10, vx: 0, vy: -p.dirY * 40, g: 0, life: 0.25, c: C.waterLight, w: 1, h: 4 });
  } else if (p.state === 'whoosh') {
    p.speed = WHOOSH_SPEED;
    moveAlong(p.speed * dt);
    checkItems();
    if (Math.random() < dt * 40)
      parts.push({ x: p.x + (Math.random() - 0.5) * 16, y: p.y + 12, vx: 0, vy: 60, g: 0, life: 0.25, c: '#ffd0c8', w: 1, h: 4 });
  } else if (p.state === 'wait') {
    p.waitT += dt;
    if (level.hurry && p.waitT > HURRY_WAIT) {   // too slow: the poo picks a way itself
      pending = Math.random() < 0.5 ? 'L' : 'R';
      Sound.say(said.has('picked') ? 'This way!' : 'Too slow! I pick this way!');
      said.add('picked');
      resolveJunction();
    }
  } else if (p.state === 'bonk') {
    p.bonkT -= dt;
    if (p.bonkT <= 0) { p.state = 'ride'; p.speed = 15; }
  } else if (p.state === 'exit') {
    trip.irisT += dt;
    if (trip.irisT >= IRIS_TIME) startDest();
  }
  cam.y += (p.y - H * LOOK - cam.y) * Math.min(1, dt * 4);
  const frac = Math.max(0, Math.min(1, (p.y - POO_START_Y) / (world.exitY - POO_START_Y)));
  ui.fill.style.width = (frac * 100).toFixed(1) + '%';
  ui.trackPoo.style.left = (frac * 100).toFixed(1) + '%';
}

function updateParts(dt) {
  for (const q of parts) {
    q.life -= dt;
    q.vy += (q.g || 0) * dt;
    q.x += q.vx * dt;
    q.y += q.vy * dt;
  }
  parts = parts.filter(q => q.life > 0);
}

/* ======== the holiday spot ======== */
function startDest() {
  dest = { d: trip.dest, t: 0, phase: 'open', hatOff: null, hatV: 0, hopT: 0, landT: 0, G: 630,
    ducks: trip.ducks, maxDucks: world.maxDucks, allDucks: world.maxDucks > 0 && trip.ducks >= world.maxDucks };
  layoutDest();
  mode = 'dest';
  parts = [];
  ui.hud.hidden = true;
  ui.left.hidden = ui.right.hidden = true;
}

// Places the exit pipe and the landing spot for the current screen size; called again after a resize.
function layoutDest() {
  const s = dest;
  s.gy = groundY(H);
  s.pipeX = Math.max(24, Math.round(W * 0.15));
  s.mouthX = s.pipeX + 12 + PIPE_R;
  s.mouthY = s.gy - 34;
  s.landX = Math.max(s.mouthX + 50, Math.round(W * 0.5));
  s.landY = s.gy - 10;
  if (s.phase === 'open' || s.phase === 'fly') {
    const x0 = s.mouthX - 8, vy = -225;
    const tf = (-vy + Math.sqrt(vy * vy + 2 * s.G * (s.landY - s.mouthY))) / s.G;
    Object.assign(s, { phase: 'open', x: x0, y: s.mouthY, vy, vx: (s.landX - x0) / tf });
  } else {
    s.x = s.landX;
    s.y = s.landY;
  }
}

function updateDest(dt) {
  const s = dest;
  s.t += dt;
  if (s.phase === 'open') {
    if (s.t > IRIS_TIME) { s.phase = 'fly'; Sound.play('launch'); }
  } else if (s.phase === 'fly') {
    s.x += s.vx * dt; s.vy += s.G * dt; s.y += s.vy * dt;
    if (s.y >= s.landY) {
      s.y = s.landY; s.x = s.landX; s.phase = 'land'; s.landT = 0;
      Sound.play('land'); Sound.buzz([40]);
      for (let i = 0; i < 12; i++)
        parts.push({ x: s.x + (Math.random() - 0.5) * 20, y: s.gy - 1, vx: (Math.random() - 0.5) * 60, vy: -Math.random() * 40, g: 120, life: 0.5, c: s.d.ground, w: 2, h: 1 });
    }
  } else if (s.phase === 'land') {
    s.landT += dt;
    if (s.landT > 0.35) { s.phase = 'hat'; s.hatOff = -s.landY - 20; s.hatV = 0; }
  } else if (s.phase === 'hat') {
    s.hatV += 600 * dt; s.hatOff += s.hatV * dt;
    if (s.hatOff >= 0) {
      s.hatOff = 0; s.phase = 'party'; s.landT = 0; s.hopT = 0;
      Sound.play('ding');
      setTimeout(() => { if (dest === s) Sound.play('fanfare'); }, 250);
      setTimeout(() => { if (dest === s) Sound.say(s.d.say); }, 900);
      if (s.allDucks) setTimeout(() => { if (dest === s) Sound.say('And you got all the ducks!'); }, 2600);
      if (!visited.includes(s.d.id)) { visited.push(s.d.id); store.set('visited', visited); }
      if (s.ducks > (bestDucks[s.d.id] || 0)) { bestDucks[s.d.id] = s.ducks; store.set('ducks', bestDucks); }
    }
  } else if (s.phase === 'party') {
    s.landT += dt; s.hopT += dt;
    if (s.landT < 3.5 && Math.random() < dt * 40) {
      const cols = ['#ff595e', '#ffca3a', '#8ac926', '#1982c4', '#6a4c93', '#ff8fab'];
      parts.push({ x: Math.random() * W, y: -4, vx: (Math.random() - 0.5) * 20, vy: 20 + Math.random() * 30, g: 10, life: 4, c: cols[Math.floor(Math.random() * 6)], w: 2, h: 2, sway: Math.random() * 6 });
    }
    if (s.landT > 0.9 && ui.done.hidden) {
      ui.doneTitle.textContent = `${s.d.emoji} ${s.d.name}!`;
      ui.doneDucks.textContent = `🦆 ${s.ducks} / ${Math.max(s.ducks, s.maxDucks)}` + (s.allDucks ? ' 👑' : '');
      const i = LEVELS.indexOf(level), next = LEVELS[i + 1];
      ui.next.hidden = !next;
      if (next) ui.next.textContent = `Next ${destOf(next).emoji}`;
      ui.done.hidden = false;
    }
  }
}

/* ======== rendering ======== */
// Four soil layers with wavy borders. The top one is criss-crossed by old pipes that are only decoration; the deeper
// ones hide things to spot: water pockets, dinosaur bones, crystal caves, fossils.
const LAYERS = [
  { base: '#7a4e33', specks: ['#8e5f3f', '#62402a', '#9a6a48'], line: '#4a2e1c', finds: ['worm', 'pebbles', 'rock', 'pebbles'], rare: ['mole', 'toycar'] },
  { base: '#9a5636', specks: ['#b0673f', '#7e4329', '#c27a4c'], stripes: '#874a2d', line: '#5a2e1a', finds: ['bone', 'pebbles', 'worm', 'pebbles', 'fossil', 'bone'], rare: ['boot', 'pot'] },
  { base: '#6e6258', specks: ['#857868', '#564c44', '#9a8c7a', '#4a423b'], gravel: true, line: '#3a322c', finds: ['rock', 'pebbles', 'bone', 'rock', 'pebbles', 'fossil'], rare: ['dinoskull'] },
  { base: '#3f3550', specks: ['#4f4462', '#2f2840', '#5d5174'], line: '#221c2e', finds: ['crystal', 'rock', 'crystal', 'pebbles', 'crystal', 'fossil'], rare: ['chest', 'mushrooms'] },
];
function makeTile(L, seed) {
  const c = document.createElement('canvas');
  c.width = c.height = 48;
  const t = c.getContext('2d');
  R(t, L.base, 0, 0, 48, 48);
  if (L.stripes) for (let y = 4; y < 48; y += 12) for (let x = 0; x < 48; x++) R(t, L.stripes, x, y + Math.round(Math.sin(x / 48 * Math.PI * 2) * 1.5), 1, 2);
  const n = L.gravel ? 150 : 90;
  for (let i = 0; i < n; i++) {
    const big = L.gravel ? i % 3 === 0 : i % 4 === 0;
    R(t, L.specks[i % L.specks.length], Math.floor(hash(i, seed) * 47), Math.floor(hash(i, seed + 1) * 47), big ? 2 : 1, big ? 2 : 1);
  }
  return c;
}
function layerTops() {
  const e = world ? world.exitY : 3000;
  return [FLOOR_H, e * 0.27, e * 0.52, e * 0.77];
}
// The wavy top edge of layer k at world x.
function layerEdge(tops, k, x) {
  if (k === 0) return FLOOR_H;
  return Math.round(tops[k] + Math.sin(x * 0.045 + k * 1.7) * 7 + Math.sin(x * 0.12 + k) * 3);
}
function layerAt(tops, x, y) {
  let k = 0;
  while (k < 3 && y >= layerEdge(tops, k + 1, x)) k++;
  return k;
}

function drawUnderground(top, bot, ox, oy) {
  const x0 = Math.floor(-ox / 2) * 2, x1 = W - ox, tops = layerTops();
  for (let k = 0; k < 4; k++) {
    if ((k < 3 && tops[k + 1] + 12 < top) || tops[k] - 12 > bot) continue;
    g.save();
    g.beginPath();
    for (let x = x0; x < x1; x += 2) {
      const ya = Math.max(top, layerEdge(tops, k, x)), yb = k < 3 ? Math.min(bot, layerEdge(tops, k + 1, x)) : bot;
      if (yb > ya) g.rect(x + ox, ya + oy, 2, yb - ya);
    }
    g.clip();
    const ya = Math.max(top, tops[k] - 12), yb = k < 3 ? Math.min(bot, tops[k + 1] + 12) : bot;
    for (let y = Math.floor(ya / 48) * 48; y < yb; y += 48)
      for (let x = Math.floor(x0 / 48) * 48; x < x1; x += 48) g.drawImage(dirtTiles[k], x + ox, y + oy);
    g.restore();
    if (k > 0) for (let x = x0; x < x1; x += 2) R(g, LAYERS[k].line, x + ox, layerEdge(tops, k, x) + oy, 2, 2);
  }
  if (top < FLOOR_H + 70) drawRoots(x0, x1, ox, oy);
  if (top < tops[1]) drawPipeMaze(Math.max(top, FLOOR_H + 24), Math.min(bot, tops[1] - 30), x0, x1, ox, oy);
  drawBigFinds(top, bot, x0, x1, ox, oy, tops);
  drawFinds(top, bot, x0, x1, ox, oy, tops);
}

function drawRoots(x0, x1, ox, oy) {
  for (let ix = Math.floor(x0 / 14); ix * 14 < x1; ix++) {
    if (hash(ix, 77) > 0.45) continue;
    const len = 8 + Math.floor(hash(ix, 78) * 40);
    let x = ix * 14 + Math.floor(hash(ix, 79) * 10);
    for (let y = 0; y < len; y++) {
      if (y % 5 === 4) x += hash(ix, y) < 0.5 ? -1 : 1;
      R(g, y < len - 6 ? '#5a3b22' : '#7a5636', x + ox, FLOOR_H + y + oy, y < len / 2 ? 2 : 1, 1);
      if (y % 9 === 6) R(g, '#5a3b22', x + (y % 18 ? 1 : -3) + ox, FLOOR_H + y + oy, 3, 1);
    }
  }
}

// Old copper and steel pipes on a 40px grid, behind the real ones. Built from hashes of world positions, so the
// maze is the same every frame and never ends sideways.
function drawPipeMaze(ya, yb, x0, x1, ox, oy) {
  if (yb <= ya) return;
  const G = 40, segs = [], nodes = [];
  const iy0 = Math.floor((ya - 20) / G), iy1 = Math.ceil((yb + 20) / G), ix0 = Math.floor(x0 / G) - 1, ix1 = Math.ceil(x1 / G) + 1;
  const inside = iy => iy * G + 20 > ya - 4 && iy * G + 20 < yb + 4;
  for (let iy = iy0; iy <= iy1; iy++) for (let ix = ix0; ix <= ix1; ix++) {
    if (!inside(iy)) continue;
    const x = ix * G + 20, y = iy * G + 20, steel = hash(ix >> 2, (iy >> 2) + 900) < 0.4;
    let deg = 0;
    if (hash(ix, iy + 1000) < 0.42) { segs.push({ x1: x, y1: y, x2: x + G, y2: y, steel, k: hash(ix, iy + 1500) }); deg++; }
    if (inside(iy + 1) && hash(ix, iy + 2000) < 0.36) { segs.push({ x1: x, y1: y, x2: x, y2: y + G, steel, k: hash(ix, iy + 2500) }); deg++; }
    if (hash(ix - 1, iy + 1000) < 0.42) deg++;
    if (inside(iy - 1) && hash(ix, iy - 1 + 2000) < 0.36) deg++;
    if (deg) nodes.push({ x, y, steel, deg });
  }
  const col = s => s ? ['#2b2f36', '#7d8792', '#b9c2cc', '#5d6670'] : ['#3a2414', '#b2683a', '#e3a06a', '#83461f'];
  for (const s of segs) R(g, col(s.steel)[0], s.x1 - 5 + ox, s.y1 - 5 + oy, s.x2 - s.x1 + 10, s.y2 - s.y1 + 10);
  for (const s of segs) {
    const [, body, light, dark] = col(s.steel);
    R(g, body, s.x1 - 4 + ox, s.y1 - 4 + oy, s.x2 - s.x1 + 8, s.y2 - s.y1 + 8);
    if (s.y1 === s.y2) { R(g, light, s.x1 + ox, s.y1 - 3 + oy, s.x2 - s.x1, 2); R(g, dark, s.x1 + ox, s.y1 + 2 + oy, s.x2 - s.x1, 2); }
    else { R(g, light, s.x1 - 3 + ox, s.y1 + oy, 2, s.y2 - s.y1); R(g, dark, s.x1 + 2 + ox, s.y1 + oy, 2, s.y2 - s.y1); }
  }
  for (const n of nodes) {
    const [ink, body, light] = col(n.steel);
    R(g, ink, n.x - 7 + ox, n.y - 7 + oy, 14, 14);
    R(g, body, n.x - 6 + ox, n.y - 6 + oy, 12, 12);
    R(g, light, n.x - 6 + ox, n.y - 6 + oy, 12, 1);
    R(g, ink, n.x - 4 + ox, n.y - 4 + oy, 1, 1); R(g, ink, n.x + 3 + ox, n.y + 3 + oy, 1, 1);
    if (n.deg === 1 && Math.floor(T * 1.3 + n.x) % 4 === 0) R(g, C.water, n.x + ox, n.y + 8 + ((T * 30) % 14) + oy, 1, 2);
  }
  for (const s of segs) {
    if (s.k > 0.16) continue;
    const mx = (s.x1 + s.x2) / 2 + ox, my = (s.y1 + s.y2) / 2 + oy;
    if (s.k < 0.09) {   // a red valve wheel
      R(g, '#5a1410', mx - 4, my - 4, 9, 9);
      R(g, '#e2493a', mx - 3, my - 3, 7, 7);
      R(g, '#5a1410', mx - 1, my - 1, 3, 3);
      R(g, '#ff8a7a', mx - 3, my - 3, 3, 1);
    } else {            // a pressure gauge
      ell(g, '#2b2f36', mx + 0.5, my + 0.5, 5, 5);
      ell(g, '#f4f4f4', mx + 0.5, my + 0.5, 4, 4);
      const a = -2.2 + Math.sin(T * 2 + s.k * 50) * 0.6;
      for (let d = 0; d < 3; d++) R(g, '#e2493a', mx + Math.round(Math.cos(a) * d), my + Math.round(Math.sin(a) * d), 1, 1);
    }
  }
}

// One big thing per 150px cell, now and then, depending on the layer: a water pocket, dinosaur bones, a crystal cave.
function drawBigFinds(top, bot, x0, x1, ox, oy, tops) {
  const G = 150;
  for (let iy = Math.floor((top - 60) / G); iy * G < bot + 60; iy++) for (let ix = Math.floor(x0 / G) - 1; ix * G < x1; ix++) {
    if (hash(ix + 40, iy + 40) > 0.3) continue;
    const x = ix * G + 30 + Math.floor(hash(ix, iy + 41) * 90) + ox, wy = iy * G + 40 + Math.floor(hash(ix, iy + 42) * 70);
    const k = layerAt(tops, x - ox, wy), y = wy + oy;
    if (wy < tops[1] + 40 || (k < 3 && wy > layerEdge(tops, k + 1, x - ox) - 40) || inCave(x - ox, wy, 30)) continue;
    if (k === 1) {
      ell(g, '#25507e', x, y, 23, 11);
      ell(g, '#3d7fc4', x, y, 22, 10);
      ell(g, '#5aa3e6', x, y - 4, 18, 4);
      R(g, '#d6efff', x - 12, y - 6, 5, 1);
      R(g, '#d6efff', x + 4 + Math.round(Math.sin(T * 2) * 3), y + 2, 3, 1);
    } else if (k === 2) {
      const bone = '#efe6cf', dark = '#b8a98a';
      for (let i = 0; i < 26; i++) R(g, bone, x - 20 + i * 2, y + Math.round(Math.sin(i * 0.35) * 2), 2, 2);
      for (let i = 0; i < 5; i++) {
        const rx = x - 12 + i * 6, ry = y + Math.round(Math.sin((rx - x + 20) / 2 * 0.35) * 2);
        for (let d = 2; d < 11 - i; d++) R(g, d % 3 ? bone : dark, rx + (d > 6 ? 1 : 0), ry + d, 1, 1);
      }
      drawProp(g, IMG.dinoskull, x + 42, y + 13);
      for (let i = 0; i < 6; i++) R(g, bone, x - 22 - i * 2, y + 1 + Math.round(i * 0.6), 2, 1);
    } else if (k === 3) {
      ell(g, '#120e1a', x, y, 27, 15);
      ell(g, '#1c1626', x, y + 1, 25, 13);
      for (let i = 0; i < 7; i++) {
        const sx = x - 20 + i * 7, len = 3 + Math.floor(hash(ix + i, iy) * 6);
        for (let d = 0; d < len; d++) R(g, '#3f3550', sx - Math.floor((len - d) / 3), y - 12 + d, 1 + Math.floor((len - d) / 2), 1);
      }
      const glow = 0.25 + Math.sin(T * 2.5 + ix) * 0.12;
      g.globalAlpha = glow;
      ell(g, '#7fe9ff', x + 4, y + 4, 14, 8);
      g.globalAlpha = 1;
      drawProp(g, IMG.crystal, x + 4, y + 13);
    }
  }
}

// Small things in the dirt: worms and pebbles near the top, bones and fossils lower down, crystals at the bottom.
// Now and then a rare find instead: a mole, a lost toy car, an old boot, a clay pot, a dinosaur skull, treasure.
function drawFinds(top, bot, x0, x1, ox, oy, tops) {
  const G = 40;
  for (let iy = Math.floor(Math.max(FLOOR_H + 30, top - 30) / G); iy * G < bot + 30; iy++) {
    for (let ix = Math.floor(x0 / G) - 1; ix * G < x1; ix++) {
      const rare = hash(ix + 11, iy + 3000) < 0.008;
      if (!rare && hash(ix, iy) > 0.14) continue;
      const x = ix * G + 10 + Math.floor(hash(ix + 300, iy) * 20), y = iy * G + 10 + Math.floor(hash(ix, iy + 500) * 20);
      if (inCave(x, y - 8, 12)) continue;
      const k = layerAt(tops, x, y), list = rare ? LAYERS[k].rare : LAYERS[k].finds;
      const name = list[Math.floor(hash(ix + 7, iy + 9) * list.length)];
      if (name === 'chest' && Math.floor(T * 3 + ix) % 5 === 0) R(g, '#fff6c8', x + ox - 6 + (ix % 3) * 5, y - 22 + oy, 1, 1);
      if (name === 'crystal' || name === 'mushrooms') {
        g.globalAlpha = 0.2 + Math.sin(T * 3 + ix * 1.7 + iy) * 0.1;
        ell(g, '#7fe9ff', x + ox, y - 10 + oy, 15, 12);
        g.globalAlpha = 1;
      }
      drawProp(g, IMG[name], x + ox, y + oy, 1, hash(ix, iy + 7) < 0.5);
    }
  }
}

/* ======== depth: layers that scroll slower or faster than the pipes ======== */
// The dirt the pipes run through has caves in it. Through them you see two rock layers further back that scroll
// slower than the pipes: the far one (FAR_F of the camera speed) with rock pillars and glow-worms, the middle one
// (MID_F) with rock ledges, old sewer pipes, waterfalls and glowing crystals. In front, dark rocks, roots and drips
// slide past the screen edges faster (FORE_F), so the pipes look deep underground.
const FAR_F = 0.25, MID_F = 0.55, FORE_F = 1.45;
const CAVE_G = 92;
const DEPTH_HAZE = '#121a36';   // the back layers fade towards this deep blue, so they look far away
function mixHex(a, b, t) {
  const A = rgb(a), B = rgb(b);
  return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
const shadeCache = new Map();
function shadeOf(k, dark) {   // a soil layer's colour, darkened for the layers behind
  const key = k + ':' + dark;
  if (!shadeCache.has(key)) shadeCache.set(key, mixHex(LAYERS[k].base, DEPTH_HAZE, dark));
  return shadeCache.get(key);
}
function zoneAt(y, tops) { let k = 0; while (k < 3 && y >= tops[k + 1]) k++; return k; }
// colour of a back layer at depth y, blended across the soil borders
function depthCol(y, dark, tops) {
  const k = zoneAt(y, tops);
  if (k < 3 && y > tops[k + 1] - 50) return mixHex(shadeOf(k, dark), shadeOf(k + 1, dark), (y - tops[k + 1] + 50) / 50 * 0.5);
  if (k > 0 && y < tops[k] + 50) return mixHex(shadeOf(k - 1, dark), shadeOf(k, dark), 0.5 + (y - tops[k]) / 50 * 0.5);
  return shadeOf(k, dark);
}

// Caves: a few overlapping ellipses per CAVE_G cell, more of them outside the pipe field than inside it.
const caveMemo = new Map();
function caveAt(ix, iy) {
  const key = ix + ',' + iy;
  if (caveMemo.has(key)) return caveMemo.get(key);
  let parts = null;
  const cx = ix * CAVE_G + 18 + hash(ix + 900, iy) * 56, cy = iy * CAVE_G + 18 + hash(ix, iy + 900) * 56;
  const outside = cx < -10 || cx > FIELD_W + 10;
  if (hash(ix + 901, iy + 901) < (outside ? 0.8 : 0.5) && cy > FLOOR_H + 80 && (!world || cy < world.exitY - 70)) {
    const rx = 26 + hash(ix + 902, iy) * 26, ry = 16 + hash(ix, iy + 902) * 16;
    parts = [{ x: cx, y: cy, rx, ry }];
    if (hash(ix + 903, iy) < 0.75) parts.push({ x: cx + (hash(ix + 904, iy) - 0.5) * rx * 1.7, y: cy + (hash(ix, iy + 904) - 0.35) * ry, rx: rx * 0.65, ry: ry * 0.8 });
    if (hash(ix + 905, iy) < 0.4) parts.push({ x: cx + (hash(ix + 906, iy) - 0.5) * rx * 1.4, y: cy - ry * 0.5, rx: rx * 0.5, ry: ry * 0.6 });
  }
  caveMemo.set(key, parts);
  return parts;
}
function cavesIn(top, bot, x0, x1) {
  const out = [];
  for (let iy = Math.floor((top - 60) / CAVE_G); iy * CAVE_G < bot + 60; iy++)
    for (let ix = Math.floor((x0 - 60) / CAVE_G); ix * CAVE_G < x1 + 60; ix++) {
      const c = caveAt(ix, iy);
      if (c) out.push(c);
    }
  return out;
}
function inCave(x, y, m = 0) {
  const ix = Math.floor(x / CAVE_G), iy = Math.floor(y / CAVE_G);
  for (let j = iy - 1; j <= iy + 1; j++) for (let i = ix - 1; i <= ix + 1; i++) {
    const c = caveAt(i, j);
    if (c && c.some(p => ((x - p.x) / (p.rx + m)) ** 2 + ((y - p.y) / (p.ry + m)) ** 2 < 1)) return true;
  }
  return false;
}
// Cuts the caves out of the dirt (drawn on the off-screen canvas), leaving a dark rim round each.
function punchCaves(top, bot, ox, oy) {
  const caves = cavesIn(top, bot, -ox, W - ox), tops = layerTops();
  for (const c of caves) for (const p of c) ell(g, LAYERS[zoneAt(p.y, tops)].line, p.x + ox, p.y + oy, p.rx + 2, p.ry + 2);
  g.globalCompositeOperation = 'destination-out';
  for (const c of caves) for (const p of c) ell(g, '#000', p.x + ox, p.y + oy, p.rx, p.ry);
  // a shadow under each cave's roof, drawn only into the holes
  g.globalCompositeOperation = 'destination-over';
  g.globalAlpha = 0.35;
  for (const c of caves) for (const p of c) ell(g, '#06030a', p.x + ox, p.y - p.ry * 0.62 + oy, p.rx, p.ry * 0.5);
  g.globalAlpha = 1;
  g.globalCompositeOperation = 'source-over';
}

let nearC = null, nearG = null;
function drawNear(top, bot, ox, oy) {
  if (!nearC || nearC.width !== W || nearC.height !== H) {
    nearC = document.createElement('canvas');
    nearC.width = W; nearC.height = H;
    nearG = nearC.getContext('2d');
  }
  nearG.clearRect(0, 0, W, H);
  const main = g;
  g = nearG;
  try { drawUnderground(top, bot, ox, oy); punchCaves(top, bot, ox, oy); } finally { g = main; }
  g.drawImage(nearC, 0, 0);
}

// Far back: dark rock, pillars that narrow and widen, and twinkling glow-worms (more of them deeper down).
function drawFar(sy0, ox) {
  const tops = layerTops(), deep = world ? world.exitY : 3000, f0 = cam.y * FAR_F;
  for (let sy = sy0; sy < H; sy += 4) R(g, depthCol(cam.y + sy, 0.52, tops), 0, sy, W, 4);
  const PW = 58;
  for (let ix = Math.floor(-ox / PW) - 1; ix * PW < W - ox; ix++) {
    if (hash(ix, 4100) > 0.45) continue;
    const cx = ix * PW + 10 + hash(ix, 4101) * 36 + ox, w0 = 7 + hash(ix, 4102) * 12;
    for (let sy = sy0 - (sy0 % 2); sy < H; sy += 2) {
      const fy = f0 + sy, cell = Math.floor(fy / 96), u = fy / 96 - cell;
      if (hash(ix, cell + 4200) > 0.7) continue;
      const up = hash(ix, cell + 4199) <= 0.7, down = hash(ix, cell + 4201) <= 0.7;
      let w = w0 + Math.sin(fy * 0.06 + ix) * 2.5;
      if (!up && u < 0.4) w *= u / 0.4;            // a stalagmite tip at the top of a pillar piece
      if (!down && u > 0.6) w *= (1 - u) / 0.4;    // and a stalactite tip at the bottom
      if (w < 1) continue;
      const wy = cam.y + sy;
      R(g, depthCol(wy, 0.36, tops), cx - w / 2, sy, w, 2);
      R(g, depthCol(wy, 0.24, tops), cx - w / 2, sy, 1, 2);
    }
  }
  const GW = 20;
  for (let iy = Math.floor((f0 + sy0) / GW); iy * GW < f0 + H; iy++) for (let ix = Math.floor(-ox / GW); ix * GW < W - ox; ix++) {
    const wy = cam.y + iy * GW - f0, dens = 0.03 + 0.16 * Math.max(0, Math.min(1, wy / deep));
    if (hash(ix + 4300, iy) > dens || wy < FLOOR_H + 40) continue;
    const tw = Math.sin(T * (1 + hash(ix, iy + 4301) * 2) + ix * 3 + iy);
    if (tw < -0.3) continue;
    const x = ix * GW + Math.floor(hash(ix, iy + 4302) * GW) + ox, y = iy * GW + Math.floor(hash(ix + 4303, iy) * GW) - f0;
    R(g, tw > 0.6 ? '#c8fff2' : '#5fd8c4', x, y, 1, 1);
  }
}

// The middle layer: rock ledges with stalactites or stalagmites, old sewer pipes, waterfalls, crystals.
function drawMid(sy0, ox) {
  const tops = layerTops(), m0 = cam.y * MID_F, G = 76;
  for (let iy = Math.floor((m0 + sy0 - 40) / G); iy * G < m0 + H + 40; iy++) for (let ix = Math.floor(-ox / G) - 1; ix * G < W - ox + G; ix++) {
    if (hash(ix + 60, iy + 6000) > 0.8) continue;
    const x = Math.round(ix * G + 12 + hash(ix, iy + 6001) * 50 + ox), y = Math.round(iy * G + 12 + hash(ix, iy + 6002) * 50 - m0);
    const wy = cam.y + y;
    if (wy < FLOOR_H + 50 || y < sy0 - 30) continue;
    const k = zoneAt(wy, tops), rock = shadeOf(k, 0.2), lit = shadeOf(k, 0.04), kind = hash(ix, iy + 6003);
    const lw = 26 + Math.floor(hash(ix + 61, iy) * 26);
    if (kind < 0.55) {   // a ledge with stalactites under it, or stalagmites on it
      const hang = kind < 0.3;
      R(g, rock, x - lw / 2, y, lw, 5);
      R(g, lit, x - lw / 2, y, lw, 1);
      for (let i = 0; i < 4; i++) {
        const sx = x - lw / 2 + 4 + i * (lw - 8) / 3, len = 5 + Math.floor(hash(ix + i, iy + 6004) * 12);
        for (let d = 0; d < len; d++) {
          const w = Math.max(1, Math.round(4 * (1 - d / len)));
          R(g, rock, sx - (w >> 1), hang ? y + 5 + d : y - 1 - d, w, 1);
        }
      }
    } else if (kind < 0.72) {   // an old sewer pipe running across, with a drip
      const pw = lw * 2, pc = mixHex('#3f9c86', DEPTH_HAZE, 0.45), pl = mixHex('#86dcc2', DEPTH_HAZE, 0.45);
      R(g, mixHex('#1d2b2a', DEPTH_HAZE, 0.35), x - pw / 2, y - 7, pw, 14);
      R(g, pc, x - pw / 2, y - 6, pw, 12);
      R(g, pl, x - pw / 2, y - 5, pw, 2);
      for (let i = 8; i < pw; i += 22) R(g, mixHex('#1d2b2a', DEPTH_HAZE, 0.35), x - pw / 2 + i, y - 8, 3, 16);
      const ph = (T * 0.9 + hash(ix, iy)) % 1;
      R(g, '#5f8fb0', x + 4, y + 7 + ph * 24, 1, 2);
    } else if (kind < 0.86 && k <= 1) {   // a waterfall pouring out of the rock
      const len = 34 + Math.floor(hash(ix + 62, iy) * 30);
      R(g, rock, x - 9, y - 4, 18, 5);
      R(g, '#2f5f86', x - 2, y, 5, len);
      for (let i = 0; i < 5; i++) R(g, '#8fc4ea', x - 2 + (i % 5), y + ((T * 70 + i * 13) % len), 1, 3);
      ell(g, '#2f5f86', x, y + len, 9, 2.5);
      R(g, '#8fc4ea', x - 5 + Math.round(Math.sin(T * 6) * 2), y + len - 2, 2, 1);
    } else if (kind < 0.86) {   // glowing crystals deep down
      g.globalAlpha = 0.18 + Math.sin(T * 2 + ix) * 0.08;
      ell(g, k === 3 ? '#b07fff' : '#7fe9ff', x, y - 4, 14, 10);
      g.globalAlpha = 1;
      for (let i = 0; i < 3; i++) {
        const cx = x - 6 + i * 6, h = 6 + Math.floor(hash(ix + i, iy + 6005) * 7), c = k === 3 ? '#9a6ad8' : '#5fc8e0';
        for (let d = 0; d < h; d++) R(g, d < 2 ? '#e6f8ff' : c, cx - Math.min(2, d >> 1), y - h + d, Math.min(2, d >> 1) * 2 + 1, 1);
      }
    } else {   // a heap of boulders
      for (let i = 0; i < 3; i++) ell(g, i === 1 ? lit : rock, x - 8 + i * 8, y - (i === 1 ? 3 : 0), 6 + (i === 1 ? 2 : 0), 5);
    }
  }
}

// In front: dark rock edges and roots on both sides of the screen, and dust or glowing spores and drips falling.
let motes = [], lastCamY = 0;
function makeMotes() {
  motes = Array.from({ length: 26 }, (_, i) => ({ x: Math.random(), y: Math.random() * H, v: 3 + Math.random() * 7, drip: i % 6 === 0, ph: i * 1.7 }));
}
function updateMotes(dt) {
  const dy = (cam.y - lastCamY) * (FORE_F - 1);
  lastCamY = cam.y;
  for (const m of motes) {
    m.y += (m.drip ? 110 : m.v) * dt - dy;
    if (m.y > H + 4) { m.y -= H + 8; m.x = Math.random(); }
    if (m.y < -4) { m.y += H + 8; m.x = Math.random(); }
  }
}
function edgeW(fy, side) {
  const s = side * 97.3, cell = Math.floor(fy / 120), u = fy / 120 - cell;
  const bump = hash(cell, 7000 + side) < 0.35 ? Math.sin(u * Math.PI) * (8 + hash(cell, 7001 + side) * 14) : 0;
  return Math.max(0, Math.round(4 + 4 * Math.sin(fy * 0.021 + s) + 3 * Math.sin(fy * 0.067 + s * 2) + bump));
}
function drawFore(ox) {
  const f0 = cam.y * FORE_F, maxW = Math.max(10, ox + 8), deep = world ? world.exitY : 3000;
  for (let sy = 0; sy < H; sy += 2) {
    if (cam.y + sy < FLOOR_H + 4) continue;
    const fy = f0 + sy;
    for (const side of [0, 1]) {
      const w = Math.min(maxW, edgeW(fy, side));
      if (!w) continue;
      R(g, '#0e0805', side ? W - w : 0, sy, w, 2);
      R(g, '#2a1a10', side ? W - w - 1 : w, sy, 1, 2);
    }
  }
  for (const m of motes) {
    const wy = cam.y + m.y;
    if (wy < FLOOR_H + 10) continue;
    const x = m.x * W + Math.sin(T * 0.8 + m.ph) * 3;
    if (m.drip) R(g, '#9fd4ff', x, m.y, 1, 3);
    else R(g, wy / deep > 0.55 ? (Math.sin(T * 3 + m.ph) > 0 ? '#9ffff0' : '#4fbfae') : '#8a6a52', x, m.y, 1, 1);
  }
}

function drawBathroom(top, ox, oy) {
  const yA = Math.floor(top);
  if (yA >= 0) return;
  R(g, C.wall, 0, yA + oy, W, -66 - yA);
  R(g, C.wallLow, 0, -66 + oy, W, 66);
  for (let y = Math.ceil(yA / 16) * 16; y < 0; y += 16) R(g, C.wallLine, 0, y + oy, W, 1);
  for (let x = Math.floor(-ox / 16) * 16; x < W - ox; x += 16) R(g, C.wallLine, x + ox, yA + oy, 1, -yA);
  R(g, C.wallBand, 0, -69 + oy, W, 5);
  drawProp(g, IMG.picture, CX + 50 + ox, -120 + oy);
  drawProp(g, IMG.towel, CX - 82 + ox, -84 + oy);
  R(g, '#9aa4b2', CX + 50 + ox, -50 + oy, 14, 2);
  R(g, '#6b7480', CX + 50 + ox, -50 + oy, 2, 6);

}

function drawFloor(ox, oy) {
  for (let x = Math.floor(-ox / 12) * 12; x < W - ox; x += 12) R(g, (x / 12) % 2 ? C.floorA : C.floorB, x + ox, oy, 12, 12);
  R(g, '#a88d62', 0, oy, W, 1);
  R(g, C.concrete, 0, 12 + oy, W, FLOOR_H - 12);

  drawProp(g, IMG.duck, CX - 78 + ox, 2 + oy, 1, true);
