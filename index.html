const PIPE_PAL = { ink: C.pipeInk, body: C.pipe, light: C.pipeLight, dark: C.pipeDark, inside: C.inside };
const PUMP_PAL = { ink: '#3a0f0c', body: '#d9483b', light: '#ff9a8a', dark: '#9a2a22', inside: '#4a1a1c' };
function drawPipes(segs, ox, oy, t) {
  const RR = PIPE_R, r = PIPE_IN, pal = s => s.pump ? PUMP_PAL : PIPE_PAL;
  const box = (s, e, c) => R(g, c, s.x1 - e + ox, s.y1 - e + oy, s.x2 - s.x1 + 2 * e, s.y2 - s.y1 + 2 * e);
  for (const s of segs) box(s, RR, pal(s).ink);
  for (const s of segs) box(s, RR - 1, pal(s).body);
  for (const s of segs) {
    const P = pal(s);
    if (s.x1 === s.x2) {
      R(g, P.light, s.x1 - RR + 2 + ox, s.y1 + oy, 2, s.y2 - s.y1);
      R(g, P.light, s.x1 - RR + 4 + ox, s.y1 + oy, 1, s.y2 - s.y1);
      R(g, P.dark, s.x1 + RR - 4 + ox, s.y1 + oy, 2, s.y2 - s.y1);
    } else {
      R(g, P.light, s.x1 + ox, s.y1 - RR + 2 + oy, s.x2 - s.x1, 2);
      R(g, P.light, s.x1 + ox, s.y1 - RR + 4 + oy, s.x2 - s.x1, 1);
      R(g, P.dark, s.x1 + ox, s.y1 + RR - 4 + oy, s.x2 - s.x1, 2);
    }
  }
  for (const s of segs) {
    const P = pal(s), vert = s.x1 === s.x2, len = vert ? s.y2 - s.y1 : s.x2 - s.x1;
    for (let k = 33; k < len - 21; k += 66) {
      if (vert) {
        const x = s.x1 + ox, y = s.y1 + k + oy;
        R(g, P.ink, x - RR - 2, y - 3, RR * 2 + 4, 7);
        R(g, P.body, x - RR - 1, y - 2, RR * 2 + 2, 5);
        R(g, P.light, x - RR - 1, y - 2, RR * 2 + 2, 1);
        R(g, P.dark, x - RR - 1, y + 2, RR * 2 + 2, 1);
        R(g, P.ink, x - RR + 1, y, 1, 1); R(g, P.ink, x + RR - 2, y, 1, 1);
      } else {
        const x = s.x1 + k + ox, y = s.y1 + oy;
        R(g, P.ink, x - 3, y - RR - 2, 7, RR * 2 + 4);
        R(g, P.body, x - 2, y - RR - 1, 5, RR * 2 + 2);
        R(g, P.light, x - 2, y - RR - 1, 1, RR * 2 + 2);
        R(g, P.dark, x + 2, y - RR - 1, 1, RR * 2 + 2);
        R(g, P.ink, x, y - RR + 1, 1, 1); R(g, P.ink, x, y + RR - 2, 1, 1);
      }
    }
  }
  for (const s of segs) if (!s.water) box(s, r, pal(s).inside);
  // pump pipes: arrows inside that keep running upwards
  for (const s of segs) if (s.pump) {
    const len = s.y2 - s.y1;
    for (let k = 0; k < 3; k++) {
      const y = s.y2 - ((t * 34 + k * len / 3) % len) + oy, x = s.x1 + ox;
      for (let i = 0; i < 6; i++) { R(g, '#ff9a8a', x - i - 1, y + i, 2, 2); R(g, '#ff9a8a', x + i - 1, y + i, 2, 2); }
    }
  }
  for (const s of segs) if (s.water) {
    box(s, r, C.water);
    const h = s.y2 - s.y1 + 2 * r;
    for (let i = 0; i < Math.ceil(h / 10); i++) {
      const x = s.x1 - r + 2 + ((i * 7) % (2 * r - 4));
      const y = (t * 110 + i * 37) % h;
      R(g, C.waterLight, x + ox, s.y1 - r + y + oy, 1, Math.min(5, h - y));
    }
  }
}

function drawExitGlow(ox, oy) {
  const y = world.exitY;
  const cols = ['#33474a', '#56685a', '#8f9a68', '#cdc879', '#fff0a0', '#ffffff'];
  cols.forEach((c, i) => R(g, c, CX - PIPE_IN + ox, y - 54 + i * 9 + oy, PIPE_IN * 2, i === 5 ? 9 + PIPE_IN : 9));
  for (let i = 0; i < 4; i++) {
    const ph = (T * 0.8 + i / 4) % 1;
    R(g, '#ffffff', CX - 6 + i * 4 + ox, y + 4 - ph * 30 + oy, 1, 1);
  }
}

function pooLook(p) {
  let eyes = (T % 3.2) < 0.13 ? 'blink' : 'open', mouth = 'smile', look = 0, sq = 0, flip = false;
  const wob = [0, 0.25, 0, -0.25][Math.floor(T * 8) % 4];
  if (p.state === 'idle') { look = [0, -1, 0, 1][Math.floor(T / 1.5) % 4]; sq = [0, 0.25][Math.floor(T * 2) % 2]; }
  else if (p.state === 'flush' || (p.state === 'ride' && p.rideT < 0.6)) { flip = Math.floor(T * 10) % 2 === 0; eyes = 'wide'; mouth = 'o'; }
  else if (p.state === 'bonk') { eyes = 'dizzy'; mouth = 'wavy'; sq = p.bonkT > BONK_TIME - 0.2 ? 0.5 : 0; }
  else if (p.state === 'whoosh') { eyes = 'wide'; mouth = 'open'; sq = -0.5; flip = Math.floor(T * 12) % 2 === 0; }
  else if (p.blocked) { eyes = 'squint'; mouth = 'wavy'; look = Math.floor(T * 2) % 2 ? 1 : 0; sq = Math.floor(T * 4) % 2 ? 0.25 : 0; }
  else if (p.clogT > 0) { eyes = 'squint'; mouth = 'grit'; sq = Math.floor(T * 16) % 2 ? 0.25 : 0; }
  else if (p.boostT > 0) { eyes = 'wide'; mouth = 'open'; sq = -0.5; }
  else if (p.state === 'wait') { look = Math.sin(T * 3) > 0 ? 1 : -1; }
  else { look = pending === 'L' ? -1 : pending === 'R' ? 1 : 0; sq = wob; }
  return { spr: pooSprite(sq, eyes, mouth, look), flip };
}

function drawHints(ox, oy) {
  const next = poo.path.find(w => w.j && w.j.type === 'T');
  if (!next || !(poo.state === 'ride' || poo.state === 'wait' || poo.state === 'flush' || poo.state === 'bonk')) return;
  const y = next.j.y + oy, nx = laneX(next.j.lane);
  if (poo.state === 'wait') {
    const b = Math.round(Math.sin(T * 8) * 2);
    drawCentered(g, SPR.arrowL, nx - 25 - b + ox, y);
    drawCentered(g, SPR.arrowR, nx + 25 + b + ox, y);
  } else if (pending) {
    drawCentered(g, pending === 'L' ? SPR.arrowL : SPR.arrowR, nx + (pending === 'L' ? -25 : 25) + ox, y);
  }
}

function drawDuck(it, ox, oy, glow) {
  const x = it.x + ox, y = it.y + oy + Math.round(Math.sin(T * 3 + it.ph) * 1.5);
  if (glow) {
    g.globalAlpha = 0.3 + Math.sin(T * 4 + it.ph) * 0.1;
    ell(g, '#fff3a0', x, y, 11, 10);
    g.globalAlpha = 1;
  }
  drawCentered(g, SPR.duck, x, y, Math.sin(T * 0.7 + it.ph) > 0);
}
// A striped gate plate that slides across the pipe from a box on its left, with a red or green light on the right.
function gateLight(it, ox, oy) {
  const x = it.x - PIPE_R - 9 + ox, y = it.y - 13 + oy, shut = gateShut(it) > 0.1;
  R(g, C.pipeInk, x - 1, y - 1, 6, 6);
  R(g, shut ? '#ff4040' : '#5aff6e', x, y, 4, 4);
  R(g, shut ? '#ffb0b0' : '#d0ffd8', x, y, 2, 1);
}
function drawGate(it, ox, oy) {
  const x = it.x + ox, y = it.y + oy, c = gateShut(it), bw = Math.round(PIPE_IN * 2 * c);
  R(g, C.pipeInk, x - PIPE_R - 13, y - 8, 15, 16);   // the box the plate slides out of
  R(g, '#9aa4b2', x - PIPE_R - 12, y - 7, 13, 14);
  R(g, '#cfd6df', x - PIPE_R - 12, y - 7, 13, 1);
  R(g, '#6b7480', x - PIPE_R - 12, y + 5, 13, 2);
  for (let i = 0; i < 13; i += 4) R(g, '#ffd43b', x - PIPE_R - 12 + i, y - 2, 2, 4);
  R(g, C.pipeInk, x + PIPE_R - 2, y - 6, 6, 12);       // the slot on the other side
  R(g, '#6b7480', x + PIPE_R - 1, y - 5, 4, 10);
  if (bw > 0) {
    R(g, '#1d1d1d', x - PIPE_IN, y - 5, bw, 10);
    for (let i = 0; i < bw; i++) for (let j = 0; j < 8; j++)
      if ((i + j) % 8 < 4) R(g, '#ffd43b', x - PIPE_IN + i, y - 4 + j, 1, 1);
  }
  gateLight(it, ox, oy);
}
// The pump at the bottom of a red pipe: a chunky box with a spinning fan.
function drawPump(it, ox, oy) {
  const x = it.x + ox, y = it.y + oy;
  R(g, PUMP_PAL.ink, x - 18, y - 7, 36, 17);
  R(g, PUMP_PAL.body, x - 17, y - 6, 34, 15);
  R(g, PUMP_PAL.light, x - 17, y - 6, 34, 1);
  R(g, PUMP_PAL.dark, x - 17, y + 7, 34, 2);
  ell(g, PUMP_PAL.ink, x, y + 1, 6, 6);
  const a = T * 18;
  for (let d = -4; d <= 4; d++) {
    R(g, '#ffe0d8', x + Math.round(Math.cos(a) * d), y + 1 + Math.round(Math.sin(a) * d), 1, 1);
    R(g, '#ffe0d8', x + Math.round(Math.cos(a + 1.57) * d), y + 1 + Math.round(Math.sin(a + 1.57) * d), 1, 1);
  }
  R(g, Math.floor(T * 3) % 2 ? '#ffe14d' : '#ff8a1a', x + 12, y - 3, 2, 2);
}

// Dark levels: everything outside the poo's lamp goes nearly black; the toilet end stays lit until you are deeper.
let darkC = null;
function drawDark(ox, oy) {
  const a = Math.max(0, Math.min(1, (cam.y - 40) / 260)) * 0.9;
  if (a <= 0) return;
  if (!darkC || darkC.width !== W || darkC.height !== H) { darkC = document.createElement('canvas'); darkC.width = W; darkC.height = H; }
  const d = darkC.getContext('2d');
  d.globalCompositeOperation = 'source-over';
  d.globalAlpha = 1;
  d.clearRect(0, 0, W, H);
  d.globalAlpha = a;
  d.fillStyle = '#05030a';
  d.fillRect(0, 0, W, H);
  d.globalCompositeOperation = 'destination-out';
  const px = poo.x + ox, py = poo.y + oy - 6, r = LAMP_R + Math.sin(T * 7) * 1.5;
  for (const [rr, al] of [[r, 0.4], [r - 9, 0.6], [r - 20, 1]]) { d.globalAlpha = al; ell(d, '#000', px, py, rr, rr); }
  d.globalAlpha = 1;
  ell(d, '#000', CX + ox, world.exitY + oy - 20, 26, 40);   // light from the end of the pipes
  d.globalCompositeOperation = 'source-over';
  g.drawImage(darkC, 0, 0);
}

function renderTrip() {
  const sh = trip && trip.shake > 0 ? Math.round((Math.random() - 0.5) * 4) : 0;
  const ox = offX + sh, oy = Math.round(-cam.y);
  const top = cam.y - 4, bot = cam.y + H + 4;
  R(g, '#2a1a10', 0, 0, W, H);
  const sy0 = Math.max(0, Math.round(FLOOR_H + oy));   // first screen row below the bathroom floor
  if (sy0 < H) { drawFar(sy0, ox); drawMid(sy0, ox); }
  drawNear(top, bot, ox, oy);
  drawBathroom(top, ox, oy);
  const seen = world ? world.items.filter(it => it.y > top - 20 && it.y < bot + 20) : [];
  if (world) {
    const segs = world.segs.filter(s => s.y2 + 30 > top && s.y1 - 30 < bot);
    drawPipes(segs, ox, oy, T);
    if (world.exitY - 40 < bot) drawExitGlow(ox, oy);
    for (const it of seen) {
      if (it.type === 'sign') drawProp(g, IMG.sign, it.x + ox, it.y + 13 + oy);
      else if (it.type === 'tp' && !it.gone && !it.pushed) drawProp(g, IMG.tproll, it.x + ox, it.y + 9 + oy);
      else if (it.type === 'water') drawProp(g, IMG.splash, it.x + ox, it.y + 6 + oy + (Math.floor(T * 4 + it.y) % 2));
      else if (it.type === 'duck' && !it.used) drawDuck(it, ox, oy, false);
      else if (it.type === 'gate') drawGate(it, ox, oy);
      else if (it.type === 'pump') drawPump(it, ox, oy);
    }
  }
  const nearTop = top < FLOOR_H + 40;
  if (nearTop) drawSprite(g, toilet.full, TOILET_X + ox, TOILET_Y + oy);
  if (nearTop && poo.state === 'flush') {
    for (let i = 0; i < 10; i++) {
      const a = T * 9 + i * 0.63;
      R(g, i % 2 ? '#ffffff' : '#3d98d6', CX + Math.cos(a) * 19 + ox, -35 + Math.sin(a) * 4 + oy, 2, 1);
    }
  }
  const look = pooLook(poo);
  const bob = poo.state === 'idle' ? (Math.floor(T * 2) % 2) : 0;
  drawPoo(look.spr, poo.x + ox, poo.y + oy + bob, look.flip);
  if (poo.tp && !poo.tp.gone) drawProp(g, IMG.tproll, poo.tp.x + ox + (Math.random() < 0.5 ? -1 : 1), poo.tp.y + 9 + oy);
  if (nearTop) { drawFloor(ox, oy); drawSprite(g, toilet.front, TOILET_X + ox, TOILET_Y + oy); }
  if (poo.state === 'bonk') {
    for (let i = 0; i < 3; i++) {
      const a = T * 6 + i * 2.1;
      drawCentered(g, SPR.star, poo.x + Math.cos(a) * 11 + ox, poo.y - 19 + Math.sin(a) * 3 + oy);
    }
  }
  drawFore(ox);
  for (const q of parts) R(g, q.c, q.x + ox, q.y + oy, q.w, q.h);
  if (world && level.dark) {
    drawDark(ox, oy);
    // things that glow or shine stay visible in the dark: ducks, faint signs, the lights on gates and pumps
    for (const it of seen) {
      if (it.type === 'duck' && !it.used) drawDuck(it, ox, oy, true);
      else if (it.type === 'sign') { g.globalAlpha = 0.35; drawProp(g, IMG.sign, it.x + ox, it.y + 13 + oy); g.globalAlpha = 1; }
      else if (it.type === 'gate') gateLight(it, ox, oy);
      else if (it.type === 'pump') R(g, Math.floor(T * 3) % 2 ? '#ffe14d' : '#ff8a1a', it.x + 12 + ox, it.y - 3 + oy, 2, 2);
    }
  }
  if (world) drawHints(ox, oy);
  if (poo.state === 'exit') iris(poo.x + ox, poo.y + oy, Math.hypot(W, H) * (1 - trip.irisT / IRIS_TIME));
}

let bgCache = null;
function sceneBg(d) {
  const key = d.id + W + 'x' + H;
  if (!bgCache || bgCache.key !== key) {
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    d.bg(c.getContext('2d'), W, H);
    bgCache = { key, c };
  }
  return bgCache.c;
}

function renderDest() {
  const s = dest;
  g.drawImage(sceneBg(s.d), 0, 0);
  s.d.fx(g, W, H, T);
  const segs = [seg(s.pipeX, s.mouthY, s.pipeX, s.gy + 6), seg(s.pipeX, s.mouthY, s.pipeX + 12, s.mouthY)];
  drawPipes(segs, 0, 0, T);
  const mx = s.pipeX + 12 + PIPE_R;
  R(g, C.pipeInk, mx - 4, s.mouthY - PIPE_R - 2, 5, PIPE_R * 2 + 4);
  R(g, C.pipe, mx - 3, s.mouthY - PIPE_R - 1, 3, PIPE_R * 2 + 2);
  R(g, C.inside, mx - 4, s.mouthY - PIPE_IN, 5, PIPE_IN * 2);
  ell(g, s.d.ground, s.pipeX, s.gy + 4, PIPE_R + 6, 4);
  let eyes = 'happy', mouth = 'open', sq = 0, flip = false, hop = 0;
  if (s.phase === 'open') { eyes = 'wide'; mouth = 'o'; }
  else if (s.phase === 'fly') { eyes = 'wide'; mouth = 'open'; flip = Math.floor(T * 10) % 2 === 0; sq = -0.5; }
  else if (s.phase === 'land') sq = s.landT < 0.15 ? 0.5 : 0.25;
  else if (s.phase === 'party') {
    const ph = s.hopT % 1.6;
    if (ph < 0.4) hop = Math.round(Math.sin(ph / 0.4 * Math.PI) * 7);
    else if (ph < 0.5) sq = 0.5;
    mouth = ph < 0.5 ? 'open' : 'smile';
    if (s.d.hat !== 'shades' && (T % 2.6) < 0.13) eyes = 'blink';
  }
  if (s.phase !== 'open') {
    const spr = pooSprite(sq, eyes, mouth, 0);
    drawPoo(spr, s.x, s.y - hop, flip);
    if (s.hatOff !== null) {
      hatCache[s.d.hat] = hatCache[s.d.hat] || hatSprite(s.d.hat);
      const sink = Math.round((POO_BODY.y + POO_BODY.h - HATS[s.d.hat].anchor) * sq * 0.24);
      drawSprite(g, hatCache[s.d.hat], Math.round(s.x) - POO_AX + HAT_DX, Math.round(s.y - hop + s.hatOff) - POO_AY + HAT_DY + sink);
    }
  }
  for (const q of parts) R(g, q.c, q.x + (q.sway ? Math.sin(T * 3 + q.sway) * 2 : 0), q.y, q.w, q.h);
  if (s.phase === 'open') iris(s.mouthX, s.mouthY, Math.hypot(W, H) * (s.t / IRIS_TIME));
}

// Black screen with a round hole, closing or opening like an old cartoon.
function iris(cx, cy, r) {
  g.fillStyle = C.night;
  for (let y = 0; y < H; y++) {
    const dy = y + 0.5 - cy;
    if (Math.abs(dy) >= r) { g.fillRect(0, y, W, 1); continue; }
    const hw = Math.sqrt(r * r - dy * dy);
    const a = Math.round(cx - hw), b = Math.round(cx + hw);
    if (a > 0) g.fillRect(0, y, a, 1);
    if (b < W) g.fillRect(b, y, W - b, 1);
  }
}

/* ======== UI ======== */
const $ = id => document.getElementById(id);
const ui = {
  menu: $('menu'), cards: $('cards'), done: $('done'), doneTitle: $('doneTitle'), doneDucks: $('doneDucks'),
  again: $('againBtn'), next: $('nextBtn'), map: $('mapBtn'),
  hud: $('hud'), home: $('homeBtn'), fill: $('trackFill'), trackPoo: $('trackPoo'), goal: $('trackGoal'),
  duckPill: $('duckPill'), duckN: $('duckN'),
  sounds: document.querySelectorAll('.sound'), left: $('leftBtn'), right: $('rightBtn'),
};

// One postcard per level, in order. Locked ones are greyed out with a padlock; finished ones get a tick and
// show the most ducks caught there.
function renderCards() {
  ui.cards.innerHTML = '';
  LEVELS.forEach((L, i) => {
    const d = destOf(L), open = unlocked(i);
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'card';
    b.disabled = !open;
    b.setAttribute('aria-label', open ? `${i + 1}: ${d.name}` : `${i + 1}: ${d.name}, locked`);
    const c = document.createElement('canvas');
    c.width = 120; c.height = 76;
    const cg = c.getContext('2d');
    cg.imageSmoothingEnabled = false;
    d.bg(cg, 120, 76);
    d.fx(cg, 120, 76, 2);
    c.setAttribute('aria-hidden', 'true');
    b.append(c);
    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = i + 1;
    num.setAttribute('aria-hidden', 'true');
    b.append(num);
    const label = document.createElement('span');
    label.className = 'label';
    label.textContent = d.name;
    if (bestDucks[d.id]) {
      const best = document.createElement('span');
      best.className = 'best';
      best.textContent = `🦆 ${bestDucks[d.id]}`;
      label.append(best);
    }
    b.append(label);
    if (!open) {
      const lock = document.createElement('span');
      lock.className = 'lock';
      lock.textContent = '🔒';
      lock.setAttribute('aria-hidden', 'true');
      b.append(lock);
    } else if (visited.includes(d.id)) {
      const st = document.createElement('span');
      st.className = 'stamp';
      st.textContent = '✔';
      st.setAttribute('aria-label', 'been there');
      b.append(st);
    }
    b.addEventListener('click', () => { Sound.unlock(); if (open) startTrip(L); });
    ui.cards.append(b);
  });
}

function setSoundIcon() { ui.sounds.forEach(b => { b.textContent = Sound.isMuted() ? '🔇' : '🔊'; }); }

ui.sounds.forEach(b => b.addEventListener('click', () => { Sound.unlock(); Sound.toggle(); setSoundIcon(); }));
ui.home.addEventListener('click', () => { Sound.play('tap'); toMenu(); });
ui.again.addEventListener('click', () => { Sound.play('tap'); startTrip(level); });
ui.next.addEventListener('click', () => { Sound.play('tap'); const n = LEVELS[LEVELS.indexOf(level) + 1]; n ? startTrip(n) : toMenu(); });
ui.map.addEventListener('click', () => { Sound.play('tap'); toMenu(); });
ui.left.addEventListener('pointerdown', e => { e.preventDefault(); Sound.unlock(); choose('L'); });
ui.right.addEventListener('pointerdown', e => { e.preventDefault(); Sound.unlock(); choose('R'); });
canvas.addEventListener('pointerdown', e => {
  Sound.unlock();
  if (mode === 'trip') choose(e.clientX < innerWidth / 2 ? 'L' : 'R');
});
addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') { Sound.unlock(); choose('L'); }
  else if (e.key === 'ArrowRight' || e.key === 'd') { Sound.unlock(); choose('R'); }
});
addEventListener('pointerdown', () => Sound.unlock(), { capture: true, once: true });

function resize() {
  if (innerWidth < 1 || innerHeight < 1) return;   // hidden or minimised: keep the last size
  const dpr = window.devicePixelRatio || 1;
  const devW = innerWidth * dpr, devH = innerHeight * dpr;
  pxScale = Math.max(1, Math.floor(Math.min(devW / FIELD_W, devH / MIN_VIEW_H)));
  W = Math.ceil(devW / pxScale);
  H = Math.ceil(devH / pxScale);
  canvas.width = W;
  canvas.height = H;
  canvas.style.width = (W * pxScale / dpr) + 'px';
  canvas.style.height = (H * pxScale / dpr) + 'px';
  offX = Math.floor((W - FIELD_W) / 2);
  g.imageSmoothingEnabled = false;
  if (mode === 'menu') cam.y = -(H - 24);
  if (mode === 'dest') layoutDest();
  makeMotes();
}
addEventListener('resize', resize);

/* ======== main loop ======== */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  T += dt;
  if (mode === 'trip') updateTrip(dt);
  else if (mode === 'dest') updateDest(dt);
  else cam.y = -(H - 24);
  updateParts(dt);
  updateMotes(dt);
  if (mode === 'dest') renderDest(); else renderTrip();
}

function start() {
  buildSprites();
  toilet = buildToilet();
  dirtTiles = LAYERS.map((L, i) => makeTile(L, 40 + i * 10));
  const arrowImg = (spr) => { const i = document.createElement('img'); i.src = spr.toDataURL(); i.alt = ''; return i; };
  ui.left.append(arrowImg(SPR.arrowL));
  ui.right.append(arrowImg(SPR.arrowR));
  // A page opened straight from disk can't export a canvas that drew poo.png, so fall back to the plain body.
  try { ui.trackPoo.src = pooSprite(0, 'open', 'smile', 0).toDataURL(); } catch { ui.trackPoo.src = IMG.poo.src; }
  setSoundIcon();
  resize();
  toMenu();
  requestAnimationFrame(frame);
}
loadAssets().then(start, err => { document.body.textContent = 'Could not load the pictures: ' + err.message; });

// Offline support: sw.js caches this page. Once the page has loaded, send it every file the page used (the font,
// the pictures) so those work offline too. Fails quietly where unsupported, e.g. on file://.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then((reg) => {
    const send = () => reg.active && reg.active.postMessage({ cache: [location.href, ...performance.getEntriesByType('resource').map((r) => r.name)] });
    send(); setTimeout(send, 5000); setTimeout(send, 20000);
  }).catch(() => {});
}
</script>
</body>
</html>
